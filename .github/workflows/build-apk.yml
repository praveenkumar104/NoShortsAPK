name: Build NoShorts Android APK in Cloud

on:
  push:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your files
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK & Gradle
        uses: android-actions/setup-android@v3

      - name: Generate Root Gradle Files Automatically & Build Debug APK
        run: |
          if [ ! -f "settings.gradle" ]; then
            echo "pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }" > settings.gradle
            echo "dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }" >> settings.gradle
            echo "rootProject.name = 'NoShorts'" >> settings.gradle
            echo "include ':app'" >> settings.gradle
          fi
          if [ ! -f "build.gradle" ]; then
            echo "plugins { id 'com.android.application' version '8.2.2' apply false; id 'org.jetbrains.kotlin.android' version '1.9.22' apply false }" > build.gradle
          fi
          gradle assembleDebug

      - name: Upload Finished APK for Download
        uses: actions/upload-artifact@v4
        with:
          name: NoShorts-Mobile-APK
          path: app/build/outputs/apk/debug/app-debug.apk
