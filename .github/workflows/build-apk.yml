name: Build NoShorts Android APK in Cloud

on:
  push:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'

      - name: Auto-Generate All Android Project Files & Compile Debug APK
        run: |
          mkdir -p app/src/main/java/com/noshorts/mobile
          mkdir -p app/src/main/res/xml

          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "NoShorts"
          include ':app'
          EOF

          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.2.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
          }
          EOF

          cat << 'EOF' > gradle.properties
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF

          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }
          android {
              namespace "com.noshorts.mobile"
              compileSdk 34
              defaultConfig {
                  applicationId "com.noshorts.mobile"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:allowBackup="true"
                  android:label="NoShorts Auto-Back">
                  <service
                      android:name=".ShortsBlockerService"
                      android:exported="true"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_service_config" />
                  </service>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/res/xml/accessibility_service_config.xml
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:packageNames="com.google.android.youtube"
              android:accessibilityEventTypes="typeWindowStateChanged|typeWindowContentChanged"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:notificationTimeout="100"
              android:canRetrieveWindowContent="true" />
          EOF

          cat << 'EOF' > app/src/main/java/com/noshorts/mobile/ShortsBlockerService.kt
          package com.noshorts.mobile

          import android.accessibilityservice.AccessibilityService
          import android.view.accessibility.AccessibilityEvent
          import android.view.accessibility.AccessibilityNodeInfo

          class ShortsBlockerService : AccessibilityService() {
              private var lastTriggerTime = 0L

              override fun onAccessibilityEvent(event: AccessibilityEvent?) {
                  if (event == null) return
                  val pkg = event.packageName?.toString() ?: return
                  if (pkg != "com.google.android.youtube") return

                  val rootNode: AccessibilityNodeInfo = rootInActiveWindow ?: return

                  val isShortOpen = hasShortsNode(rootNode, "com.google.android.youtube:id/reel_watch_fragment_root") ||
                                    hasShortsNode(rootNode, "com.google.android.youtube:id/reel_recycler")

                  if (isShortOpen) {
                      val now = System.currentTimeMillis()
                      if (now - lastTriggerTime > 600) {
                          lastTriggerTime = now
                          performGlobalAction(GLOBAL_ACTION_BACK)
                      }
                  }
              }

              private fun hasShortsNode(node: AccessibilityNodeInfo, viewId: String): Boolean {
                  val matches = node.findAccessibilityNodeInfosByViewId(viewId)
                  return matches != null && matches.isNotEmpty()
              }

              override fun onInterrupt() {}
          }
          EOF

          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          gradle assembleDebug --no-daemon

      - name: Upload Finished APK for Download
        uses: actions/upload-artifact@v4
        with:
          name: NoShorts-Mobile-APK
          path: app/build/outputs/apk/debug/app-debug.apk
